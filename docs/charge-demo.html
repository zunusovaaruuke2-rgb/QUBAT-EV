<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Qubat EV</title><style>*{box-sizing:border-box}body{margin:0;background:#101b19;color:white;font:16px system-ui}main{max-width:480px;margin:auto;padding:24px}h1{color:#55db9a}section{background:#20332c;border-radius:16px;padding:18px;margin:16px 0}button,select{font:inherit;border:1px solid #527567;border-radius:12px;padding:15px;background:#20332c;color:white}button.selected{border:2px solid #55db9a}#start{width:100%;background:#55db9a;color:#10291e;font-weight:bold;margin-top:16px}select{width:100%}#stats{white-space:pre-line;line-height:1.9}small{color:#a4b9af}</style><main><h1>Q⚡ Qubat EV</h1><small>ДЕМО · без оплаты</small><section><h2>Чуй — Суюнбаева</h2><p>Бишкек · 80 кВт</p><label>Станция<select id="station"><option value="1">Станция №1</option><option value="2">Станция №2</option><option value="3">Станция №3</option><option value="4">Станция №4</option></select></label><p>14 сом/кВт·ч</p></section><section><h3>Разъём</h3><button id="a" class="selected">GB/T A</button> <button id="b">GB/T B</button><button id="start">Начать зарядку</button><p id="stats" aria-live="polite"></p></section><small>Симуляция. Реальные станции не подключены.</small></main><script>const $=id=>document.getElementById(id);let gun='A',active=false,t=0;const s=new URLSearchParams(location.search).get('station');if(['1','2','3','4'].includes(s))$('station').value=s;function choose(g){if(active)return;gun=g;$('a').classList.toggle('selected',g==='A');$('b').classList.toggle('selected',g==='B')}$('a').onclick=()=>choose('A');$('b').onclick=()=>choose('B');function update(){let e=t*60/3600;$('stats').textContent=[active?'Зарядка идёт':'Зарядка завершена','Разъём '+gun,'Мощность: '+(active?60:0)+' кВт','Энергия: '+e.toFixed(3)+' кВт·ч','Стоимость: '+(e*14).toFixed(2)+' сом'].join('\n')}$('start').onclick=()=>{active=!active;if(active)t=0;$('station').disabled=$('a').disabled=$('b').disabled=active;$('start').textContent=active?'Остановить зарядку':'Начать зарядку';update()};setInterval(()=>{if(active){t++;update()}},1000)</script></html>
