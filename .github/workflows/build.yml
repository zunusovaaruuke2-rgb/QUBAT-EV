name: Android CI
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon assembleDebug assembleRelease testDebugUnitTest lintDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QUBAT-EV-optimized-and-reports
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/reports/
            app/build/test-results/
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Check public world map style
        run: |
          curl --fail --location --retry 2 --max-time 30 https://tiles.openfreemap.org/styles/liberty --output /tmp/qubat-world-style.json
          curl --fail --location --retry 2 --max-time 30 https://tiles.openfreemap.org/styles/dark --output /tmp/qubat-night-style.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash -c './gradlew connectedDebugAndroidTest && ./gradlew assembleRelease && python3 scripts/smoke_optimized.py; qubat_ui_exit=$?; adb pull /sdcard/Android/data/kg.qubat.ev/files/partner-preview app/build/reports/partner-preview >/dev/null 2>&1 || true; if [ "$qubat_ui_exit" -ne 0 ]; then python3 scripts/print_android_failures.py; adb logcat -d -s QUBAT_MAP:E QUBAT_PARTNER:V AndroidRuntime:E; fi; exit "$qubat_ui_exit"'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: QUBAT-EV-verified-apk
          path: app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-smoke-reports
          path: |
            app/build/reports/androidTests/
            app/build/reports/partner-preview/
