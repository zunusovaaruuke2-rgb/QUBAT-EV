name: Build QUBAT EV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: unzip -o QUBAT_EV_GitHub_Upload.zip
      - name: Fix Android 12 splash resources
        run: rm -rf QUBAT_EV_Android/app/src/main/res/values-v31
      - name: Build APK
        working-directory: QUBAT_EV_Android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QUBAT-EV-APK
          path: QUBAT_EV_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
